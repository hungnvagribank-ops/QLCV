<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<title>Quản lý công việc – Viện NCĐT</title>
<style>
:root{--bg:#f6f3f2;--card:#fff;--tx:#2a1a1d;--mu:#7a6b6e;--bd:#e8dfdf;--pr:#9b0f2f;--pr2:#6f0a22;--ac:#f2c14e;--ok:#2e7d4f;--wr:#c0392b;--hi:#fbeaea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1a1214;--card:#261a1d;--tx:#f3e9ea;--mu:#b5a3a6;--bd:#3b2a2e;--pr:#e0476a;--hi:#3a1e24;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;color:var(--pr);letter-spacing:.5px}.brand small{display:block;font-weight:500;color:var(--mu);letter-spacing:0;font-size:11px}
.sp{flex:1}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pr2);color:#fff;border-color:var(--pr2);font-weight:600}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(120deg,#7a0b24,#b01234);color:#fff;border-radius:14px;padding:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero h1{margin:4px 0;font-size:24px}.hero small{opacity:.85}.hero .b{background:var(--ac);color:#3b2a00;border:0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}.tabs button{white-space:nowrap}.tabs .on{background:var(--pr2);color:#fff;border-color:var(--pr2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.st{cursor:pointer}.st b{display:block;font-size:30px;color:var(--pr);line-height:1.1;margin:4px 0}.st.red{background:var(--hi);border-color:var(--pr)}
.mu{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 28px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar i{display:block;height:6px;border-radius:4px;background:var(--pr)}.bar div{background:var(--bd);border-radius:4px}
.t{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px;margin:8px 0}
.t.o{border-left:4px solid var(--wr)}.t h4{margin:0 0 2px;font-size:14.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;background:var(--bd);margin-right:4px}
.chip.r{background:var(--wr);color:#fff}.chip.g{background:var(--ok);color:#fff}.chip.y{background:var(--ac);color:#3b2a00}
.act button{font-size:12px;padding:4px 9px;margin:2px}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl input{flex:1;min-width:150px}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.pp{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd)}
.tree ul{list-style:none;margin:4px 0;padding-left:20px;border-left:2px solid var(--bd)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(460px,94vw)}
dialog label{display:block;margin:10px 0 3px;font-weight:600}dialog input,dialog select,dialog textarea{width:100%}
body{display:flex}main{flex:1;min-width:0}
nav{width:232px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#7a0b24,#5a0719);color:#fff;padding:14px 10px}
nav small{opacity:.8;font-size:11px}.nb{display:flex;align-items:center;gap:10px}.nb b{display:block;font-size:21px;font-weight:800;letter-spacing:1px;color:#fff;line-height:1.1}.nb small{display:block;color:#f2c14e;font-size:12px;font-weight:600;opacity:1;margin-top:2px}.ng{font-size:10.5px;opacity:.7;margin:14px 8px 4px;letter-spacing:.5px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;color:#fff}nav a:hover,nav a.on{background:rgba(255,255,255,.16)}nav a.soon{opacity:.55}nav a i{font-style:normal;font-size:10px;background:rgba(255,255,255,.2);padding:1px 6px;border-radius:9px}
nav a .l{display:flex;align-items:center;gap:11px}nav a{font-size:13.5px}
.nf{margin-top:18px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:13px}
body.nav nav{display:none}
@media(max-width:800px){nav{position:fixed;z-index:20;display:none;left:0;top:0}body.nav nav{display:block}}
.kb{display:flex;gap:10px;overflow-x:auto;align-items:flex-start}.col{min-width:215px;flex:1;background:var(--bd);border-radius:12px;padding:10px;min-height:120px}
.kc{background:var(--card);border-radius:9px;padding:9px;margin-top:8px;cursor:grab;font-size:13px;border-left:3px solid var(--pr)}.kc.o{border-left-color:var(--wr)}.kc button{font-size:11px;padding:2px 7px;margin:4px 3px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}.cd{min-height:84px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:11px}.cd.td{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}
.ce{background:var(--bd);border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ce.r{background:var(--wr);color:#fff}.ce.g{background:var(--ok);color:#fff}
</style></head><body>
<nav id="nav"></nav><main><div class="top"><button onclick="document.body.classList.toggle('nav')">☰</button><div class="brand">Quản lý công việc</div><div class="sp"></div>
<label class="mu">Xem với tư cách <select id="who"></select></label></div>
<div class="wrap" id="app"></div></main>
<dialog id="dlg"><h3 style="margin:0">Giao việc mới</h3>
<label>Tiêu đề</label><input id="f_t"><label>Giao cho</label><select id="f_to"></select>
<label>Hạn hoàn thành</label><input id="f_d" type="date"><label>Mức ưu tiên</label>
<select id="f_p"><option>Cao</option><option selected>Trung bình</option><option>Thấp</option></select>
<label>Ghi chú</label><textarea id="f_n" rows="2"></textarea>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button onclick="dlg.close()">Hủy</button><button class="p" onclick="addTask()">Giao việc</button></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TD=new Date();TD.setHours(0,0,0,0);const TODAY=fmt(TD);
const addD=n=>{const d=new Date(TD);d.setDate(d.getDate()+n);return fmt(d)};
const vd=s=>s.split('-').reverse().join('/');
const DATA=[["hantt","Nguyễn Thị Thu Hà","gd",-1],["tannguyenthithanh","Nguyễn Thị Thanh Tân","pgd",-1],["giangntt","Nguyễn Thị Thu Giang","pgd",-1],["hanhpt","Phạm Thị Hạnh","pgd",-1],["hungchumanh","Chu Mạnh Hùng","pgd",-1],["giangdangxuan","Đặng Xuân Giang","tp",0],["anhduongtuan","Dương Tuấn Anh","pp",0],["lamnguyenthi","Nguyễn Thị Lâm","pp",0],["dungvuthikim","Vũ Thị Kim Dung","pp",0],["vugiangthe","Giang Thế Vũ","nv",0],["ngocnguyengiang","Nguyễn Giang Ngọc","nv",0],["trungnguyenha","Nguyễn Hà Trung","nv",0],["liennguyenthi","Nguyễn Thị Liên","nv",0],["quynhntt","Nguyễn Thị Thanh Quỳnh","nv",0],["ngocnguyenthiyen","Nguyễn Thị Yến Ngọc","nv",0],["duongnguyentung","Nguyễn Tùng Dương","nv",0],["hungnguyenviet","Nguyễn Việt Hưng","nv",0],["duphamquoc","Phạm Quốc Dự","nv",0],["thanhphamthihuyen","Phạm Thị Huyền Thanh","nv",0],["hungphamvan","Phạm Văn Hùng","tp",1],["huongduongthu","Dương Thu Hương","pp",1],["phuongduongthu","Dương Thu Phượng","pp",1],["huongnguyenthithanh2","Nguyễn Thị Thanh Hương","pp",1],["hangnguyenthithanhthuy","Nguyễn Thị Thanh Thúy Hằng","pp",1],["huongnguyenthithu57","Nguyễn Thị Thu Hường","pp",1],["thuytranthithanh","Trần Thị Thanh Thủy","pp",1],["phuongduongthu2","Dương Thu Phương","nv",1],["dungnguyenthi1","Nguyễn Thị Dung","nv",1],["anhnguyenthiphuong","Nguyễn Thị Phương Anh","nv",1],["hienphamthu12","Phạm Thu Hiền","nv",1],["chauvungoc","Vũ Ngọc Châu","nv",1],["trangdamnguyenhanh","Đàm Nguyễn Hạnh Trang","nv",1],["lanbuiphong","Bùi Phong Lan","tp",2],["binhbuithanh","Bùi Thanh Bình","pp",2],["giangnguyenthiquynh","Nguyễn Thị Quỳnh Giang","pp",2],["tutrantrong","Trần Trọng Tú","pp",2],["lenguyenthihong2","Nguyễn Thị Hồng Lê","nv",2],["nganguyenthithanh1","Nguyễn Thị Thanh Nga","nv",2],["mainguyentuyet","Nguyễn Tuyết Mai","nv",2],["quynhphamthuy2","Phạm Thúy Quỳnh","nv",2],["haiphamthi","Phạm Thị Hải","nv",2],["tinhdaothihuyen","Đào Thị Huyền Tính","nv",2],["phongdangngocthien","Đặng Ngọc Thiên Phong","nv",2],["dongphamduy","Phạm Duy Đông","tp",3],["linhphamthingoc","Phạm Thị Ngọc Linh","pp",3],["duyphamvan","Phạm Văn Duy","pp",3],["thuyvothidieu","Võ Thị Diệu Thúy","pp",3],["phuongbuithilan1","Bùi Thị Lan Phương","nv",3],["haonguyenhoan","Nguyễn Hoàn Hảo","nv",3],["huongnguyenlan","Nguyễn Lan Hương","nv",3],["thuynguyenthi112","Nguyễn Thị Thúy","nv",3],["tubapham","Phạm Bá Tú","nv",3],["tuanphamvan","Phạm Văn Tuân","nv",3],["phuongtathithuy","Tạ Thị Thúy Phượng","nv",3],["ledaothi","Đào Thị Lê","nv",3],["minhkieubinh","Kiều Bình Minh","tp",4],["hangmathithu","Mai Thị Thu Hằng","pp",4],["huyennguyenthinhu","Nguyễn Thị Như Huyền","pp",4],["lanhphamthi","Phạm Thị Lành","pp",4],["hienduongthithu","Dương Thị Thu Hiền","nv",4],["hanhnguyenthiai","Nguyễn Thị Ái Hạnh","nv",4],["trangphamquynh","Phạm Quỳnh Trang","nv",4],["huyenphamthi8","Phạm Thị Huyền","nv",4],["admin","Quản trị viên","admin",-1],["admin1","admin","admin",-1]];
const DEPTS=["Phòng Quản lý đào tạo và Thư viện", "Phòng Nghiên cứu và giảng dạy", "Phòng Kế hoạch", "Phòng Tổng hợp", "Phòng Kế toán"];
const ST=['Mới giao','Đã tiếp nhận','Đang thực hiện','Chờ xác nhận','Cần bổ sung','Tạm dừng','Hoàn thành'];
const ROLE={gd:'Giám đốc',pgd:'Phó giám đốc',bgd:'Ban giám đốc',tp:'Trưởng phòng',pp:'Phó phòng',nv:'Cán bộ',admin:'Quản trị viên'};
const P=DATA.map((r,i)=>({id:i,user:r[0],name:r[1],role:r[2],dept:r[3]}));
const lead=u=>['gd','pgd','bgd','admin'].includes(u.role);
const scope=u=>lead(u)?[0,1,2,3,4]:[u.dept];
const inD=d=>P.filter(p=>p.dept==d);
const NCB=P.filter(p=>p.role!='admin').length;
const TITLES=['Rà soát chương trình đào tạo nghiệp vụ tín dụng','Báo cáo tiến độ quý IV','Xây dựng bộ đề khảo thí','Cập nhật học liệu E-learning','Tổng hợp nhu cầu đào tạo năm 2027','Lập kế hoạch giảng dạy tháng 11','Đề tài nghiên cứu chuyển đổi số','Quyết toán kinh phí đào tạo','Chuẩn hóa giáo trình quản trị rủi ro','Tổ chức hội thảo chuyên đề','Đánh giá chất lượng giảng viên','Soạn thảo quy chế đào tạo','Khảo sát học viên sau khóa học','Kiểm tra tài sản, thiết bị lớp học','Biên soạn tài liệu sản phẩm mới'];
function seed(){const fl=[];[10,1,8,1,1,1,5].forEach((c,i)=>{for(let k=0;k<c;k++)fl.push(ST[i])});
return Array.from({length:27},(_,k)=>{const s=fl[(k*11)%27],d=k%5,pe=inD(d).filter(p=>p.role!='tp'),to=pe[(k*3+2)%pe.length],by=k%3==0?P[0]:k%3==1?inD(d).find(p=>p.role=='tp'):P[1+(k>>1)%3];
const od=k%5==1&&s!='Hoàn thành',due=s=='Hoàn thành'?addD(-(3+k%5)):od?addD(-(2+k%6)):addD(4+k*2%20);
return{id:'CV-'+String(k+1).padStart(3,'0'),title:TITLES[k%15]+(k>=15?' (đợt 2)':''),dept:d,by:by.id,to:to.id,due,pri:['Cao','Trung bình','Thấp'][k%3],st:s,note:'',doneAt:s=='Hoàn thành'?(k==5?addD(-1):addD(-(4+k%5))):null}})}
let T;try{T=JSON.parse(localStorage.getItem('qlcv_v2'))}catch(e){}if(!T)T=seed();
const save=()=>{try{localStorage.setItem('qlcv_v2',JSON.stringify(T))}catch(e){}};
const S={u:0,tab:'ov',q:'',st:'',dp:'',over:false,m:0};const me=()=>P[S.u];
const visible=t=>{const u=me();return u.role=='nv'?t.to==u.id||t.by==u.id:scope(u).includes(t.dept)||t.by==u.id};
const isOver=t=>t.st!='Hoàn thành'&&t.due<TODAY;
const label=p=>p.name+' – '+ROLE[p.role]+(p.dept>=0?' ('+DEPTS[p.dept].replace('Phòng ','')+')':'');
$('#who').innerHTML=P.map(p=>`<option value="${p.id}">${esc(label(p))}</option>`).join('');
$('#who').onchange=e=>{S.u=+e.target.value;S.dp='';render()};
function acts(t){const u=me(),a=[];if(t.to==u.id){const m={'Mới giao':[['Tiếp nhận','Đã tiếp nhận']],'Đã tiếp nhận':[['Bắt đầu','Đang thực hiện']],'Đang thực hiện':[['Báo hoàn thành','Chờ xác nhận'],['Tạm dừng','Tạm dừng']],'Tạm dừng':[['Tiếp tục','Đang thực hiện']],'Cần bổ sung':[['Thực hiện lại','Đang thực hiện']]};a.push(...(m[t.st]||[]))}
if(t.st=='Chờ xác nhận'&&(t.by==u.id||u.role=='gd'))a.push(['Xác nhận hoàn thành','Hoàn thành'],['Yêu cầu bổ sung','Cần bổ sung']);return a}
function setSt(id,s){const t=T.find(x=>x.id==id);log(t.id+': '+t.st+' → '+s);t.st=s;t.doneAt=s=='Hoàn thành'?TODAY:null;save();render()}
function taskHtml(t){const to=P[t.to],by=P[t.by],o=isOver(t);
return`<div class="card t ${o?'o':''}"><div><h4>${esc(t.title)}</h4><div class="mu">${t.id} · ${esc(DEPTS[t.dept])}<br>Giao cho: <b>${esc(to.name)}</b> · Người giao: ${esc(by.name)} · Hạn: ${vd(t.due)}</div>
<div style="margin-top:5px"><span class="chip ${t.st=='Hoàn thành'?'g':t.st=='Chờ xác nhận'?'y':''}">${t.st}</span><span class="chip">Ưu tiên: ${t.pri}</span>${o?'<span class="chip r">Quá hạn</span>':''}</div></div>
<div class="act">${acts(t).map(a=>`<button onclick="setSt('${t.id}','${a[1]}')">${a[0]}</button>`).join('')}</div></div>`}
const NAV=[['LÀM VIỆC',[['today','Việc hôm nay'],['ov','Trang chủ'],['given','Công việc đã giao'],['tk','Tất cả công việc'],['chain','Chuỗi việc',1]]],['GIAO VIỆC TỔ',[['team','Danh sách tổ',1]]],['THEO DÕI',[['kb','Bảng tiến độ'],['cal','Lịch làm việc'],['rec','Công việc định kỳ',1],['rep','Báo cáo',1],['wk','Giao ban tuần',1],['ev','Đánh giá hiệu quả',1]]],['HỆ THỐNG',[['org','Cơ cấu tổ chức'],['cb','Danh sách cán bộ'],['pos','Chức năng & vị trí',1],['adm','Quản trị',1],['log','Nhật ký hệ thống']]]];
const TT=Object.fromEntries(NAV.flatMap(g=>g[1]).map(i=>[i[0],i[1]]));
let LG;try{LG=JSON.parse(localStorage.getItem('qlcv_log'))}catch(e){}if(!LG)LG=[];
const log=x=>{LG.unshift({at:new Date().toLocaleString('vi-VN'),by:me().name,x});LG=LG.slice(0,200);try{localStorage.setItem('qlcv_log',JSON.stringify(LG))}catch(e){}};
function render(){const u=me(),V=T.filter(visible);let b='';
const hero=`<div class="hero"><div><small>VIỆN NGHIÊN CỨU VÀ ĐÀO TẠO AGRIBANK</small><h1>Toàn cảnh hoạt động của Viện</h1><small>Đang xem: ${esc(label(u))} · ${vd(TODAY)}</small></div><div class="sp"></div>${u.role!='nv'?'<button class="b" onclick="openNew()">+ Giao việc mới</button>':''}</div>`;
if(S.tab=='ov'){const open=V.filter(t=>t.st!='Hoàn thành'),od=V.filter(isOver),w=V.filter(t=>t.st=='Chờ xác nhận'),dn=V.filter(t=>t.st=='Hoàn thành'),on=dn.filter(t=>t.doneAt<=t.due),rate=dn.length?Math.round(on.length/dn.length*100):0;
const cs=[['Tổng công việc',V.length,'Trong phạm vi được xem',''],['Đang thực hiện',open.length,'Gồm cả việc chờ xác nhận','open'],['Quá hạn',od.length,'Cần ưu tiên đôn đốc','over'],['Chờ xác nhận',w.length,'Kết quả đang chờ duyệt','wait'],['Đã hoàn thành',dn.length,'Đã được xác nhận','done'],['Tỷ lệ đúng hạn',rate+'%','Trên số việc đã hoàn thành','']];
const mx=Math.max(1,...ST.map(s=>V.filter(t=>t.st==s).length)),ds=scope(u),dc=ds.map(d=>[d,open.filter(t=>t.dept==d).length]),dm=Math.max(1,...dc.map(x=>x[1]));
b=`<div class="cards">${cs.map(c=>`<div class="card st ${c[3]=='over'?'red':''}" onclick="jump('${c[3]}')"><span class="mu">${c[0]}</span><b>${c[1]}</b><span class="mu">${c[2]}</span></div>`).join('')}</div>
<div class="g2"><div class="card"><b>Phân bổ trạng thái</b> <span class="mu">${V.length} việc được xem</span>${ST.map(s=>{const n=V.filter(t=>t.st==s).length;return`<div class="bar"><span>${s}</span><div><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`}).join('')}</div>
<div class="card"><b>Khối lượng theo phòng</b> <span class="mu">Việc đang mở</span>${dc.map(x=>`<div class="bar"><span>${esc(DEPTS[x[0]])}</span><div><i style="width:${x[1]/dm*100}%"></i></div><b>${x[1]}</b></div>`).join('')}</div></div>
